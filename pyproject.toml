[project]
name = "cooklint"
version = "0.1.0"
description = "Linter for the Cooklang recipe files in this repo"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cooklint = "cooklint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cooklint"]
